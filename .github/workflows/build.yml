name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The README's "nothing leaves the phone" rests on the app not holding
      # INTERNET. This checks the manifest that actually ships, after merging,
      # so a permission contributed by a dependency fails the build rather than
      # arriving unannounced.
      - name: Check the app cannot reach the network
        run: |
          merged=$(find app/build/intermediates -path '*merged_manifest*' \
            -name AndroidManifest.xml | head -1)
          if [ -z "$merged" ]; then
            echo "no merged manifest found under app/build/intermediates." >&2
            echo "the build layout moved, so this check cannot run." >&2
            exit 1
          fi
          echo "merged manifest: $merged"
          scripts/check-no-network.sh --merged "$merged"

      - uses: actions/upload-artifact@v5
        with:
          name: unscroll-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
